<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>XYM Thread (ジムスレッド) - SYMBOLブロックチェーンに投稿するSNS</title>

    <meta name="description" content="SYMBOLブロックチェーンを活用したスレッドです。XYMを使って投稿・コメントしよう！">
    <meta name="keywords" content="XYM, Symbol, ブロックチェーン, 分散型SNS, 暗号通貨, Web3, NFT, XYM Thread">

    <meta property="og:type" content="website">
    <meta property="og:title" content="XYM Thread (ジムスレッド) - SYMBOLブロックチェーンに投稿するSNS">
    <meta property="og:description" content="SYMBOLブロックチェーンを活用したスレッドです。XYMを使って投稿・コメントしよう！">
    <meta property="og:url" content="https://xym-thread.com/">
    <meta property="og:image" content="https://xym-thread.com/src/xymthread2.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="XYM Thread (ジムスレッド) - SYMBOLブロックチェーンに投稿するSNS">
    <meta name="twitter:description" content="SYMBOLブロックチェーンを活用したスレッドです。XYMを使って投稿・コメントしよう！">
    <meta name="twitter:image" content="https://xym-thread.com/src/xymthread2.png">

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "XYM Thread",
          "url": "https://xym-thread.com",
          "description": "SYMBOLブロックチェーンを活用した分散型SNS"
        }
        </script>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div id="loading-spinner" style="display:none;">
        <div class="spinner"></div>
    </div>

    <header id="header">
        <img src="src/xymthread2.png" alt="XYM Thread Banner">
    </header>

    <!-- LINE登録ボタン -->
    <div style="display: flex; justify-content: center; margin: 30px 0;">
        <button onclick="openLineRegister()"
            style="background:#00B900; color:white; padding:14px 28px; border:none; border-radius:10px; font-weight:bold; font-size:17px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.15);">
            LINE通知登録
        </button>
    </div>

    <div class="hamburger-menu">
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav class="menu">
            <ul>
                <li><a href="ToS.html" target="_blank">&nbsp;利用規約</a></li>
                <li><a href="https://note.com/mikun_nem/n/na87cc657591e" target="_blank">&nbsp;&nbsp;&nbsp;使い方</a></li>
                <li><a href="#" id="open-metadata-modal">&nbsp;SMD登録</a></li>
            </ul>
        </nav>
    </div>

    <div id="metadata-modal" class="social-metadata-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>ソーシャルメタデータ</h2>
            <div class="avatar-container">
                <img id="avatar-preview" src="" alt="Avatar" class="avatar" style="display:none;">
            </div>
            <label for="imageUrl">Image URL</label>
            <input type="text" id="imageUrl" placeholder="https://image.url">

            <label for="url">SNS URL</label>
            <input type="text" id="url" placeholder="https://x.com/yourprofile">

            <label for="namespace">ネームスペース (ある場合)</label>
            <input type="text" id="namespace" placeholder="namespace">

            <label for="name">名前</label>
            <input type="text" id="name" placeholder="name">

            <button id="submit-metadata">登録 / 更新 </button>
            <button id="cancel-metadata">キャンセル</button>
        </div>
    </div>

    <!-- スレッド作成ボタン -->
    <button id="open-modal" class="create-thread">スレッドを作成📝</button>

    <!-- カレンダーボタン -->
    <button id="calendar-button">
        <img src="src/calendar.png" alt="カレンダー">
    </button>

    <div id="calendar-popup" class="calendar-modal">
        <div class="calendar-content">
            <span class="close-calendar">&times;</span>
            <div id="calendar"></div>
        </div>
    </div>


    <!-- モーダルのHTML -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>スレッドを作成</h2>
            <div id="thread_address"></div>
            <textarea id="thread-message" placeholder="メッセージを入力"></textarea>
            <input type="number" id="xym-amount" placeholder="送金するXYMを入力" step="0.000001" min="0">
            <button id="create-thread-button" class="create-thread">作成</button>
        </div>
    </div>
    <!-- スレッド一覧を表示する場所 -->
    <div id="thread-list"></div>

    <!-- スタイルの適用 -->
    <link rel="stylesheet" href="style.css">


    <!--  V2  <script type="text/javascript" src="https://xembook.github.io/nem2-browserify/symbol-sdk-pack-2.0.5.js"></script> -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>

</html>
